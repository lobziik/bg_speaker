[project]
name = "narrator-bot"
version = "0.1.0"
description = "Twitch Narrator Bot - Reads chat in a dramatic fantasy narrator style with TTS"
readme = "README.md"
license = "MIT"
requires-python = "==3.12.*"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.12",
    "jinja2>=3.1.0",
    "websockets>=13.0",
    # Data validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # Database
    "aiosqlite>=0.20.0",
    # Twitch
    "twitchio>=3.0.0",
    # HTTP client
    "httpx>=0.27.0",
    # TTS
    "piper-tts>=1.2.0",
    # LLM clients
    "groq>=0.11.0",
    # Gemini (LLM + TTS)
    "google-genai>=2.0.0",
    # Utilities
    "structlog>=24.0.0",
]

[project.optional-dependencies]

dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "pre-commit>=3.8.0",
    "ty>=0.0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM", "TCH", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
# These files use TypedDicts/classes at runtime, not just for type hints
"src/api/websocket.py" = ["TC001"]
"src/services/worker.py" = ["TC001"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
