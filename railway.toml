[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[[mounts]]
source = "data"
destination = "/app/data"

[[mounts]]
source = "piper-models"
destination = "/home/narrator/.local/share/piper-tts"
