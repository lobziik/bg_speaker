# BG3 Narrator Bot - Default Configuration
# Safe to commit to version control

app:
  name: "BG3 Narrator Bot"
  debug: false
  log_level: "INFO"

server:
  host: "0.0.0.0"
  port: 8000
  cors_origins:
    - "*"

paths:
  database: "${DATABASE_URL:-sqlite:///data/narrator.db}"
  prompts: "./config/prompts"
  models: "./models"

# Default values for SQLite settings (used on first run)
defaults:
  language:
    source_lang: "ru"
    narrator_lang: "en"
    subtitle_lang: "ru"
    auto_translate: true

  providers:
    llm: "groq"
    tts: "piper"
    translate: "llm"

  piper:
    voice: "en_US-lessac-medium"
    length_scale: 1.0
    noise_scale: 0.667

  queue:
    max_size: 50
    message_min_length: 1
    message_max_length: 300
    cooldown_seconds: 5
    tts_rate_limit_seconds: 10

  reward:
    title: "Narrator TTS"
    cost: 500
    prompt: "Enter your message for the narrator"
    background_color: "#6441A4"
    sync_cooldown_with_rate_limit: true
    refund_on_queue_full: true
    refund_on_filtered: true
